# Model catalog for this gateway. Edit freely; the catalog container re-reads the file
# whenever it changes. Prices are USD per 1M tokens, Standard tier, and WILL go stale:
# each entry carries the page it came from and the date it was read.
#
# `id` is the name clients send to the gateway (LiteLLM model_name). Keep it in step
# with litellm/config.yaml; `available` in the served catalog tells you when they differ.

schema = "mason.catalog/v1"
gateway = "home"
as_of = "2026-11-16"

# ---------------------------------------------------------------- OpenAI via Bedrock Mantle
[[models]]
id = "gpt-5.6-sol"
lab = "openai"
upstream = { provider = "bedrock-mantle", model_id = "openai.gpt-5.6-sol", via = "translator" }
apis = ["chat", "responses", "messages"]
context_window = 1050000
max_output_tokens = 128000
effort = { param = "reasoning_effort", levels = ["none", "low", "medium", "high", "xhigh"], default = "medium" }
[models.pricing]
input = 4.40
output = 22.00
cache_read = 0.44
cache_write = 5.50
long_context = { above_input_tokens = 272000, input = 8.80, output = 33.00, cache_read = 0.88, cache_write = 11.00 }
note = "In-Region (bedrock-mantle), commercial Regions. Mantle Regions: us-east-1, us-east-2."
source = "https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-openai-gpt-56-sol.html"

